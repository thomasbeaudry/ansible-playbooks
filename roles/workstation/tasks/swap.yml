- name: Get system RAM in GB
  ansible.builtin.set_fact:
    ram_gb: "{{ (ansible_memtotal_mb / 1024) | round(0, 'ceil') | int }}"

- name: Get free disk space on /
  ansible.builtin.set_fact:
    root_free_gb: >-
      {{
        (
          ansible_mounts
          | selectattr('mount', 'equalto', '/')
          | map(attribute='size_available')
          | first
          / 1024 / 1024 / 1024
        ) | round(0, 'floor') | int
      }}

# For systems with RAM ≥ 32GB, set swap to ~25% of RAM;
# otherwise progressively reduce swap to 8G/4G/2G based on available space.
- name: Decide desired /swapfile size in GB
  ansible.builtin.set_fact:
    newSwapSize: >-
      {%- set ram = ram_gb | int -%}
      {%- set free = root_free_gb | int -%}
      {%- if ram >= 32 -%}
        {%- set target = ((ram / 4) | round(0, 'ceil') | int) -%}
        {%- if free >= target + 2 -%}
          {{ target }}
        {%- elif free >= 8 -%}
          8
        {%- elif free >= 4 -%}
          4
        {%- else -%}
          2
        {%- endif -%}
      {%- elif free > ram * 4 -%}
        {{ ram * 2 }}
      {%- elif free > ram * 2 -%}
        {{ ram }}
      {%- elif free >= 8 -%}
        8
      {%- elif free >= 4 -%}
        4
      {%- else -%}
        2
      {%- endif -%}

- name: Get active swap files/devices
  ansible.builtin.command:
    cmd: swapon --noheadings --raw --output NAME
  register: active_swaps
  changed_when: false
  failed_when: false

- name: Check /swapfile
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat

- name: Set current /swapfile size in GB
  ansible.builtin.set_fact:
    current_swapfile_gb: "{{ (swapfile_stat.stat.size | default(0) / 1024 / 1024 / 1024) | round(0, 'floor') | int }}"

- name: Decide whether /swapfile needs resize/rebuild
  ansible.builtin.set_fact:
    swapfile_needs_rebuild: "{{ (current_swapfile_gb | int) != (newSwapSize | int) }}"

- name: Remove legacy /swap.img entry from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*/swap\.img\s+'
    state: absent

- name: Turn off legacy /swap.img if present
  ansible.builtin.command:
    cmd: swapoff /swap.img
  changed_when: true
  failed_when: false

- name: Remove legacy /swap.img file
  ansible.builtin.file:
    path: /swap.img
    state: absent

- name: Remove duplicate /swapfile entries from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*/swapfile\s+'
    state: absent

- name: Rebuild /swapfile only when size is wrong
  when: swapfile_needs_rebuild | bool
  block:
    - name: Turn off /swapfile if active
      ansible.builtin.command:
        cmd: swapoff /swapfile
      when: "'/swapfile' in (active_swaps.stdout_lines | default([]))"
      changed_when: true
      failed_when: false

    - name: Remove old /swapfile before recreating
      ansible.builtin.file:
        path: /swapfile
        state: absent

    - name: Create /swapfile at desired size
      ansible.builtin.command:
        cmd: "fallocate -l {{ newSwapSize | int }}G /swapfile"
      changed_when: true

    - name: Set /swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: Format /swapfile
      ansible.builtin.command:
        cmd: mkswap /swapfile
      changed_when: true

- name: Ensure /swapfile permissions are correct
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Ensure /swapfile is in fstab once
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present

- name: Refresh active swap list
  ansible.builtin.command:
    cmd: swapon --noheadings --raw --output NAME
  register: active_swaps_after
  changed_when: false
  failed_when: false

- name: Turn on /swapfile if not active
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: "'/swapfile' not in (active_swaps_after.stdout_lines | default([]))"
  changed_when: true
